name: Refresh public game data

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-data-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, pinned from the official repository
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4, pinned from the official repository
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh official game, balance and esports bulletins
        run: npm run official:sync
      - name: Refresh official hero and map catalog independently
        run: npm run catalog:sync
      - name: Read public feeds and preserve last good snapshot on failure
        continue-on-error: true
        run: npm run sync
      - name: Refresh bundled hero, ability and map images
        run: npm run media:sync
      - name: Validate data, functionality and production build
        run: |
          npm run check
          npm run media:check
          npm test
          npm run build
      - name: Commit only a meaningful data change
        id: commit
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/siteData.json data/official-catalog.json data/rivals-updates.json data/asset-manifest.json public/media
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh public snapshot and bundled artwork'
          git push origin "HEAD:$DEFAULT_BRANCH"
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Notify configured hosting deploy hook
        if: steps.commit.outputs.changed == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL }}
        run: node scripts/trigger-deploy.mjs
